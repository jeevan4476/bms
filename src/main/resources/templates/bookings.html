<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BMS - My Bookings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 class="page-title">My Booking &amp; Transaction History</h1>
    <p style="color: #64748b; margin-bottom: 2rem;">This module (Transaction Tracking) was developed by jeevan-cs240.</p>
    
    <div class="card">
        <div th:if="${#lists.isEmpty(transactions)}" style="text-align: center; padding: 2rem;">
            <p style="color: #64748b;">You haven't made any bookings yet.</p>
            <a th:href="@{/}" class="btn" style="display: inline-block; margin-top: 1rem;">Browse Events</a>
        </div>
        
        <table th:unless="${#lists.isEmpty(transactions)}" class="table">
            <thead>
                <tr>
                    <th>Show</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}">
                    <td>
                        <div style="font-weight: 600;" th:text="${tx.eventTitle}">Event</div>
                        <div style="font-size: 0.8rem; color: #64748b;" th:text="'Booking ID: #' + ${tx.bookingId}">#1</div>
                    </td>
                    <td th:text="${#temporals.format(tx.timestamp, 'dd MMM yyyy, HH:mm')}">Date</td>
                    <td>$<span th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}">0.00</span></td>
                    <td>
                        <span th:class="'status-badge status-' + ${tx.status.toLowerCase()}" 
                              th:text="${tx.status}">STATUS</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
