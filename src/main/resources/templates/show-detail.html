<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'BMS - ' + ${show.event.title}">BMS - Select Seats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- HTMX Loaded for API calls -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf?.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="show-page-wrapper">
    <aside class="show-sidebar">
        <a th:href="@{/events/{id}(id=${show.event.id})}" class="back-link">Back to Event</a>

        <div class="sidebar-event">
            <div class="sidebar-event-badge" th:text="${show.event.eventType}">SPORT</div>
            <h2 th:text="${show.event.title}">Event Title</h2>
            <p class="sidebar-venue" th:text="${show.venue.name}">Venue</p>
            <p class="sidebar-time" th:text="${#temporals.format(show.startTime, 'EEE, MMM dd - hh:mm a')}">Time</p>
        </div>

        <div class="price-legend" th:if="${sections != null and !sections.isEmpty()}">
            <h4>Sections</h4>
            <div th:each="section : ${sections}"
                 class="price-cat"
                 th:classappend="${section == activeSection} ? ' active' : ''"
                 th:data-url="@{/shows/{id}(id=${show.id},section=${section})}"
                 th:data-section="${section}">
                <span class="price-cat-dot"></span>
                <span th:text="${section}">Section</span>
            </div>
        </div>

        <div class="sidebar-summary">
            <h4>Your Selection</h4>
            <div class="summary-line"><span>Seats</span><span id="sel-count">0</span></div>
            <div class="summary-line total"><span>Total</span><span id="sel-total">₹0.00</span></div>
            <div id="sel-seats-list" class="sel-tags"></div>
        </div>

        <form th:action="@{/shows/{id}/book(id=${show.id})}" method="post" id="booking-form">
            <div id="seat-hidden-inputs"></div>
            <button type="submit" id="book-btn" class="btn-book" disabled>Book Now</button>
            <div id="login-prompt" style="display:none; text-align:center; padding:10px;">
                <a th:href="@{/login}">Log in</a> to book seats.
            </div>
        </form>
    </aside>

    <main class="show-main">
        <div th:if="${layoutType == 'STADIUM'}" class="venue-visual stadium-visual">
            <svg viewBox="0 0 600 420" class="stadium-svg" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="300" cy="210" rx="285" ry="200" fill="#dde3ea" stroke="#b5bfc9" stroke-width="2"/>
                <ellipse cx="300" cy="210" rx="175" ry="120" fill="#2d8a3e"/>
                <ellipse cx="300" cy="210" rx="160" ry="106" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="300" y1="90" x2="300" y2="330" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <path d="M 115,30 A 200,200 0 0,1 485,30 Q 300,75 115,30 Z" class="stand-section" data-stand="North Stand"/>
                <text x="300" y="50" text-anchor="middle" class="stand-label" style="pointer-events:none;">NORTH</text>
                <path d="M 115,390 A 200,200 0 0,0 485,390 Q 300,345 115,390 Z" class="stand-section" data-stand="South Stand"/>
                <text x="300" y="408" text-anchor="middle" class="stand-label" style="pointer-events:none;">SOUTH</text>
                <path d="M 555,80 A 200,200 0 0,1 555,340 Q 510,210 555,80 Z" class="stand-section" data-stand="East Stand"/>
                <text x="573" y="215" text-anchor="middle" class="stand-label" transform="rotate(90,573,215)" style="pointer-events:none;">EAST</text>
                <path d="M 45,80 A 200,200 0 0,0 45,340 Q 90,210 45,80 Z" class="stand-section" data-stand="West Stand"/>
                <text x="27" y="215" text-anchor="middle" class="stand-label" transform="rotate(-90,27,215)" style="pointer-events:none;">WEST</text>
            </svg>
        </div>

        <div th:if="${layoutType == 'CONCERT_ARENA'}" class="venue-visual concert-visual">
            <div class="concert-diagram">
                <div class="concert-stage">STAGE</div>
                <!-- Semi-circle zones -->
                <div th:each="section, sectionStat : ${sections}" 
                     class="concert-zone" 
                     th:classappend="'zone-' + ${sectionStat.index}">
                    <span class="zone-label" th:text="${section}">FLOOR</span>
                </div>
            </div>
        </div>

        <div th:if="${layoutType == 'THEATRE'}" class="venue-visual theatre-visual">
            <div class="theatre-screen-bar"></div>
            <p style="font-size:0.7rem; letter-spacing:3px; color:#64748b; margin-top:0.5rem;">SCREEN</p>
        </div>

        <div class="seat-area">
            <!-- seat-zone is no longer directly controlled by HTMX attributes to avoid Thymeleaf 3.1 issues -->
            <div id="seat-zone">
                <div th:fragment="seatMapFragment">
                    <div class="seat-section-header" th:if="${activeSection != null}">
                        <span th:text="${activeSection}">Section</span>
                    </div>
                    <div th:each="entry : ${seatMap}" class="seat-row" th:classappend="${layoutType == 'CONCERT_ARENA'} ? ' concert-row' : (${layoutType == 'THEATRE'} ? ' theatre-row' : '')">
                        <span class="seat-row-label" th:text="${entry.key}">A</span>
                        <div th:each="seat : ${entry.value}" th:id="'seat-' + ${seat.id}" class="seat" 
                             th:classappend="${seat.status == 'BOOKED'} ? ' seat-booked' : (${seat.status == 'LOCKED_BY_ME'} ? ' seat-locked-me' : (${seat.status == 'LOCKED_BY_OTHER'} ? ' seat-locked-other' : ''))"
                             th:data-id="${seat.id}" th:data-row="${seat.row}" th:data-number="${seat.number}" th:data-status="${seat.status}">
                            <span th:text="${seat.number}">1</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var PRICE_PER_SEAT = /*[[${show.price}]]*/ 0;
    var SHOW_ID        = /*[[${show.id}]]*/ 0;
    var IS_AUTH        = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
    var currentSection = /*[[${activeSection}]]*/ null;
    var selectedSeats  = [];

    // ── Global click listener ──
    document.addEventListener('click', function(e) {
        var cat = e.target.closest('.price-cat');
        if (cat) loadSection(cat.getAttribute('data-url'), cat.getAttribute('data-section'));
        
        var stand = e.target.closest('.stand-section');
        if (stand) {
            var name = stand.getAttribute('data-stand');
            var catEl = document.querySelector('.price-cat[data-section="'+name+'"]');
            if (catEl) loadSection(catEl.getAttribute('data-url'), name);
        }
        
        var seat = e.target.closest('.seat');
        if (seat) {
            var st = seat.getAttribute('data-status');
            if (st !== 'BOOKED' && st !== 'LOCKED_BY_OTHER') toggleSeat(seat);
        }
    });

    // Handle HTMX events for syncing state
    document.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'seat-zone') {
            syncSelectionState();
        }
    });

    function loadSection(url, name) {
        if (!url) return;
        currentSection = name;
        document.querySelectorAll('.price-cat').forEach(function(c){ 
            c.classList.toggle('active', c.getAttribute('data-section')===name); 
        });
        htmx.ajax('GET', url, {target: '#seat-zone', swap: 'innerHTML'});
    }

    // ── Polling: Every 8 seconds ──
    setInterval(function() {
        if (!currentSection) return;
        var url = '/shows/' + SHOW_ID + '?section=' + encodeURIComponent(currentSection);
        htmx.ajax('GET', url, {target: '#seat-zone', swap: 'innerHTML'});
    }, 8000);

    // Initial state
    document.querySelectorAll('.seat-locked-me').forEach(function(el) {
        selectedSeats.push({id: el.getAttribute('data-id'), row: el.getAttribute('data-row'), number: el.getAttribute('data-number')});
    });
    updateSummary();

    function syncSelectionState() {
        selectedSeats.forEach(function(s) {
            var el = document.getElementById('seat-' + s.id);
            if (el) {
                var st = el.getAttribute('data-status');
                if (st === 'BOOKED' || st === 'LOCKED_BY_OTHER') {
                    selectedSeats = selectedSeats.filter(function(i){ return i.id !== s.id; });
                } else { el.classList.add('seat-locked-me'); }
            }
        });
        updateSummary();
    }

    async function toggleSeat(el) {
        if (!IS_AUTH) { window.location.href = '/login'; return; }
        var seatId = el.getAttribute('data-id');
        el.style.opacity = '0.5';
        try {
            var csrfEl = document.querySelector('meta[name="_csrf"]');
            var headerEl = document.querySelector('meta[name="_csrf_header"]');
            var headers = {'Content-Type': 'application/json'};
            if (csrfEl && headerEl) {
                headers[headerEl.content] = csrfEl.content;
            }
            
            var res = await fetch('/api/locks/shows/'+SHOW_ID+'/seats/'+seatId+'/toggle', {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin'
            });
            el.style.opacity = '1';
            if (res.ok) {
                var data = await res.json();
                if (data.status === 'LOCKED_BY_ME') {
                    el.classList.add('seat-locked-me');
                    el.setAttribute('data-status', 'LOCKED_BY_ME');
                    selectedSeats.push({id: seatId, row: el.getAttribute('data-row'), number: el.getAttribute('data-number')});
                } else {
                    el.classList.remove('seat-locked-me');
                    el.setAttribute('data-status', 'AVAILABLE');
                    selectedSeats = selectedSeats.filter(function(s){ return s.id !== seatId; });
                }
                updateSummary();
            }
        } catch (err) { el.style.opacity = '1'; }
    }

    function updateSummary() {
        var count = selectedSeats.length;
        document.getElementById('sel-count').textContent = count;
        document.getElementById('sel-total').textContent = '₹' + (count * PRICE_PER_SEAT).toFixed(2);
        document.getElementById('sel-seats-list').innerHTML = selectedSeats.map(function(s){ return '<span class="sel-tag">'+(s.row||'')+s.number+'</span>'; }).join('');
        var btn = document.getElementById('book-btn');
        if (!IS_AUTH) { btn.style.display = 'none'; document.getElementById('login-prompt').style.display='block'; }
        else { btn.disabled = count === 0; }
        document.getElementById('seat-hidden-inputs').innerHTML = selectedSeats.map(function(s){ return '<input type="hidden" name="seatIds" value="'+s.id+'">'; }).join('');
    }
    /*]]>*/
</script>
</body>
</html>
