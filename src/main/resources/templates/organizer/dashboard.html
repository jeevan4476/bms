<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS - Organizer Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <header style="margin-bottom: 2rem;">
        <h1 class="page-title">Welcome, <span th:text="${organizerName}">Organizer</span></h1>
        <p class="page-subtitle">Personal Sales Dashboard &amp; Analytics</p>
    </header>

    <!-- Summary Statistics -->
    <div class="card-grid" style="margin-bottom: 2rem;">
        <div class="card" style="text-align: center; padding: 2rem; border-left: 5px solid #2563eb;">
            <div style="font-size: 2.5rem; font-weight: 700; color: #2563eb;" th:text="${totalTickets}">0</div>
            <div style="color: #64748b; margin-top: 0.5rem; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Tickets Sold</div>
        </div>
        <div class="card" style="text-align: center; padding: 2rem; border-left: 5px solid #16a34a;">
            <div style="font-size: 2.5rem; font-weight: 700; color: #16a34a;">
                $<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0.00</span>
            </div>
            <div style="color: #64748b; margin-top: 0.5rem; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Your Revenue</div>
        </div>
    </div>

    <!-- Shows List -->
    <div class="card">
        <h3 style="margin-bottom: 1.5rem;">Event Performance Details</h3>
        
        <div th:if="${#lists.isEmpty(reports)}" class="empty-state">
            <p>You haven't been assigned any events yet.</p>
        </div>

        <div th:unless="${#lists.isEmpty(reports)}" class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Show / Venue</th>
                        <th>Occupancy</th>
                        <th>Tickets</th>
                        <th>Revenue</th>
                        <th>Efficiency</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${reports}">
                        <td>
                            <div style="font-weight: 700; color: #1e293b;" th:text="${report.eventTitle}">Event Name</div>
                            <div style="font-size: 0.8rem; color: #64748b;" th:text="${report.venueName}">Venue Name</div>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <div style="flex-grow: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; max-width: 100px;">
                                    <div th:style="'width: ' + ${report.occupancyPercent} + '%; height: 100%; background: #2563eb;'"></div>
                                </div>
                                <span style="font-weight: 600;" th:text="${report.occupancyPercent} + '%'">0%</span>
                            </div>
                        </td>
                        <td th:text="${report.bookedSeats} + ' / ' + ${report.totalSeats}">0 / 100</td>
                        <td style="font-weight: 600; color: #16a34a;">
                            $<span th:text="${#numbers.formatDecimal(report.revenue, 1, 2)}">0.00</span>
                        </td>
                        <td>
                            <span style="display: inline-block; padding: 0.25rem 0.5rem; background: #eff6ff; color: #2563eb; border-radius: 4px; font-weight: 700; font-size: 0.85rem;">
                                $<span th:text="${#numbers.formatDecimal(report.revenuePerSeat, 1, 2)}">0.00</span>/seat
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
